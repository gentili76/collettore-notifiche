name: check-sources

on:
  schedule:
    # GitHub puo' ritardare le esecuzioni: 5 minuti e' il minimo.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Serve per committare lo stato in state/.
permissions:
  contents: write

concurrency:
  group: check-sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - run: pip install -r worker/requirements.txt

      - name: Controlla le sorgenti
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
        run: python worker/check.py

      - name: Salva lo stato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Nessuna modifica allo stato."
          else
            git commit -m "chore: aggiorna stato sorgenti"
            git push
          fi
